version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "00:01"
      timezone: "Europe/London"
    target-branch: "master"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@types/node"
        versions: [">= 25.0.0"]
